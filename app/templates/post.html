{% extends 'base.html' %}{% block content %}
<article class="container article-page"><header><a class="text-link" href="/blog">All field notes</a><div class="eyebrow">{{ item.data.date }} / {{ reading_minutes }} min read</div><h1>{{ item.data.title }}</h1><p class="article-deck">{{ item.data.summary }}</p><div class="tags">{% for tag in item.data.tags|tags %}<span>{{ tag }}</span>{% endfor %}</div><p class="byline">Written by {{ person.name }}</p></header><div class="prose">{{ body|safe }}</div></article>
{% endblock %}
