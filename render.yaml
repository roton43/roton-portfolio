services:
  - type: web
    name: roton-portfolio
    runtime: docker
    region: singapore
    plan: free
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: roton
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SITE_URL
        fromService:
          name: roton-portfolio
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: ALLOWED_HOSTS
        fromService:
          name: roton-portfolio
          type: web
          envVarKey: RENDER_EXTERNAL_HOSTNAME
